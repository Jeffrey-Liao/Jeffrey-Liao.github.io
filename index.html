<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8" />
  <title>廖润康❤️毕小宇</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="个人知识库" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css" />
  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
</head>

<body>
  <div id="app">加载中...</div>

  <!-- Docsify 配置 -->
  <script>
    window.$docsify = {
      name: '❤️🥰😘',
      coverpage: true,
      loadNavbar: true,
      sidebarDisplayLevel: 1,
      subMaxLevel: 3,
      maxLevel: 5,
      mergeNavbar: true,
      auto2top: true,
      pagination: {
        previousText: '上一章节',
        nextText: '下一章节'
      },
      search: {
        placeholder: '搜索',
        noData: '找不到结果',
        depth: 4
      },
      count: {
        countable: true,
        position: 'top',
        margin: '10px',
        float: 'right',
        fontsize: '0.9em',
        color: 'rgb(90,90,90)',
        language: 'chinese'
      }
    };
  </script>

  <!-- 核心依赖 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>

  <!-- KaTeX 支持 -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- 在 Docsify 渲染完成后自动渲染 LaTeX -->
  <script>
    window.$docsify.plugins = [].concat(
      function(hook, vm) {
        hook.doneEach(function() {
          // 渲染所有 LaTeX 公式
          renderMathInElement(document.body, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "\\[", right: "\\]", display: true },
              { left: "$", right: "$", display: false },
              { left: "\\(", right: "\\)", display: false }
            ],
            throwOnError: false
          });

          // Utterances 评论（可选）
          const utterances = document.getElementById('utterances-comments');
          if (utterances) {
            utterances.innerHTML = '';
            const script = document.createElement('script');
            script.src = 'https://utteranc.es/client.js';
            script.setAttribute('repo', 'yourname/your-repo'); // ⚠️ 替换为你的 GitHub 仓库
            script.setAttribute('issue-term', 'pathname');
            script.setAttribute('theme', 'github-light');
            script.setAttribute('crossorigin', 'anonymous');
            script.async = true;
            utterances.appendChild(script);
          }
        });
      }
    );
  </script>

  <!-- 其他插件 -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@latest/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code"></script>
</body>
</html>
