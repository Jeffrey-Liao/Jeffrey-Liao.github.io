        }

            text-align: center;
            margin: 1.5rem 0;
        }
        button {
            background: #4a6491;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1.05rem;
            border-radius: 6px;
            cursor: pointer;
            margin: 0 0.5rem;
            transition: background 0.2s;

            background: #2c3e50;
        }
        button:disabled {

        }

        }

</head>

                    "离散地区代码（如EU, NA）",
                    "高频更新列",
                    "大文本字段"
                ],
                "answer": 1,
                "explanation": "List分区用于离散值映射，如region IN ('EU', 'NA')。原文表格明确。"
            },
            {
                "q": "$V(R,A)$在查询代价模型中表示？",
                "options": [
                    "R中A属性的总记录数",
                    "R中A属性的平均长度",
                    "R中A属性的唯一值数量",
                    "R中A属性的空值数量"
                ],
                "answer": 2,
                "explanation": "$V(R,A)$定义为R中A属性的唯一值数量。原文：‘$V(R,A)$是A中唯一的数据的数量’。"
            },
            {
                "q": "若T(R)=1000，V(R,A)=10，A为非键属性，则SC(R,A)≈？",
                "options": [
                    "1",
                    "10",
                    "100",
                    "1000"
                ],
                "answer": 2,
                "explanation": "$SC(R,A) = T_R / V(R,A) = 1000 / 10 = 100$。原文公式：‘SC(R, A)=$T_R / V(R,A)$’。"
            },
            {
                "q": "Nested Loop Join的最优I/O代价是？",
                "options": [
                    "$T_R * B_S + B_R$",
                    "$B_R + B_S$",
                    "$B_R * B_S + B_R$",
                    "$2*(B_R+B_S) + (B_R+B_S)$"
                ],
                "answer": 1,
                "explanation": "Nested Loop Join最优代价为$B_R + B_S$。原文：‘Best: $B_R+B_S$’。"
            },
            {
                "q": "Sort-Merge Join的总代价公式是？",
                "options": [
                    "$B_R + B_S$",
                    "$cost\:of\:sorting + B_S + B_R$",
                    "$B_R + T_R * c$",
                    "$2*(B_R+B_S)$"
                ],
                "answer": 1,
                "explanation": "Sort-Merge代价 = 排序代价 + $B_S + B_R$。原文公式明确。"
            },
            {
                "q": "CBO选择执行计划的核心依据是？",
                "options": [
                    "预定义规则集",
                    "SQL语句长度",
                    "统计信息（statistics）",
                    "索引数量"
                ],
                "answer": 2,
                "explanation": "CBO基于统计信息估算代价。原文：‘基于统计信息（statistics）估算不同执行计划的‘代价’（cost）’。"
            },
            {
                "q": "Information Rule强调的核心原则是？",
                "options": [
                    "所有数据（含元数据）必须以表形式存储",
                    "所有数据必须加密存储",
                    "所有数据必须有备份副本",
                    "所有数据必须建立索引"
                ],
                "answer": 0,
                "explanation": "第一定律：所有数据（含元数据）必须以表形式存储。原文：‘Everything in a database must be stored in a table format’。"
            },
            {
                "q": "Guaranteed Access Rule要求的访问三元组是？",
                "options": [
                    "表名 + 外键 + 列名",
                    "表名 + 主键（行值） + 属性名（列值）",
                    "数据库名 + 用户名 + 表名",
                    "索引名 + 键值 + 页号"
                ],
                "answer": 1,
                "explanation": "第二定律：通过表名、主键（行值）、属性名（列值）保证访问。原文：‘combination of *table-name*, *primary-key* (row value), and *attribute-name* (column value)’。"
            },
            {
                "q": "NULL值必须被如何处理？",
                "options": [
                    "全部忽略",
                    "系统化且统一处理",
                    "强制转换为0",
                    "强制转换为空字符串"
                ],
                "answer": 1,
                "explanation": "第三定律：NULL必须系统化、统一处理。原文：‘must be given a systematic and uniform treatment’。"
            },
            {
                "q": "Active Online Catalog要求结构元数据存储于？",
                "options": [
                    "操作系统文件",
                    "数据字典（data dictionary）",
                    "应用程序配置文件",
                    "备份归档文件"
                ],
                "answer": 1,
                "explanation": "第四定律：结构描述存储于数据字典（data dictionary）。原文：‘stored in an online catalog, known as data dictionary’。"
            },
            {
                "q": "Non-Subversion Rule禁止的行为是？",
                "options": [
                    "低级接口绕过安全与完整性约束",
                    "用户不使用SQL访问数据库",
                    "索引未设置唯一性约束",
                    "日志文件未加密存储"
                ],
                "answer": 0,
                "explanation": "第十二定律：低级接口不能绕过安全与完整性约束。原文：‘the interface must not be able to subvert the system and bypass security and integrity constraints’。"
            }
        ];

        // === DOM & Logic ===
        const quizEl = document.getElementById('quiz');
        const submitBtn = document.getElementById('submitBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resultEl = document.getElementById('result');
        const scoreNumEl = document.getElementById('scoreNum');
        const feedbackEl = document.getElementById('feedback');

        // Render questions
        questions.forEach((q, idx) => {
            const qEl = document.createElement('div');
            qEl.className = 'question';
            qEl.innerHTML = `
                <div style="display:flex;align-items:flex-start;">
                    <div class="q-number">${idx + 1}</div>
                    <div class="q-content">
                        <div class="q-text">${q.q}</div>
                        <div class="options">
                            ${q.options.map((opt, i) => `
                                <label class="option">
                                    <input type="radio" name="q${idx}" value="${i}" />
                                    <span>${opt}</span>
                                </label>
                            `).join('')}
                        </div>
                        <div class="explanation">💡 ${q.explanation}</div>
                    </div>
                </div>
            `;
            quizEl.appendChild(qEl);
        });

        // Toggle explanation on click
        document.querySelectorAll('.q-content').forEach((el, idx) => {
            el.addEventListener('click', () => {
                const exp = el.querySelector('.explanation');
                if (exp) exp.classList.toggle('show');
            });
        });

        // Submit handler
        submitBtn.addEventListener('click', () => {
            let score = 0;
            const explanations = document.querySelectorAll('.explanation');
            
            questions.forEach((q, idx) => {
                const selected = document.querySelector(`input[name="q${idx}"]:checked`);
                const optEl = selected ? selected.closest('.option') : null;
                
                // Reset previous highlights
                explanations[idx].classList.remove('correct', 'incorrect');
                if (optEl) optEl.style.backgroundColor = '';
                
                if (selected && parseInt(selected.value) === q.answer) {
                    score++;
                    if (optEl) optEl.style.backgroundColor = '#e8f5e9';
                    explanations[idx].classList.add('correct');
                } else if (selected) {
                    if (optEl) optEl.style.backgroundColor = '#ffebee';
                    explanations[idx].classList.add('incorrect');
                }
            });

            // Show result
            scoreNumEl.textContent = score;
            feedbackEl.innerHTML = score >= 45 ? 
                '🎉 优秀！掌握全面，概念扎实。' : 
                score >= 35 ? 
                '👍 良好！核心知识点已掌握，细节可加强。' : 
                score >= 25 ? 
                '⚠️ 加油！建议重读《重点.md》对应章节。' : 
                '📚 建议系统复习全部基础概念。';
            
            resultEl.style.display = 'block';
            
            // Scroll to result
            resultEl.scrollIntoView({ behavior: 'smooth' });
        });

        // Reset handler
        resetBtn.addEventListener('click', () => {
            document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
            document.querySelectorAll('.explanation').forEach(e => e.classList.remove('show', 'correct', 'incorrect'));
            document.querySelectorAll('.option').forEach(o => o.style.backgroundColor = '');
            resultEl.style.display = 'none';
        });
    </script>
</body>
</html>
