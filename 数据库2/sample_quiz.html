            border-color: #3498db;
        }

            color: white;
            border-color: #2980b9;
        }
        
        .option.correct {
            background-color: #27ae60;
            color: white;
            border-color: #219653;
        }

            background-color: #e74c3c;
            color: white;
            border-color: #c0392b;
        }

            margin-top: 15px;
            padding: 10px;
            background-color: #fff8e1;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
            display: none;
        }

        }

            margin-top: 30px;
            padding: 20px;
            background-color: #e8f4f8;
            border-radius: 5px;
            text-align: center;
            display: none;
        }

            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .feedback {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }

            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;

        }

        }

            height: 10px;
            background-color: #ecf0f1;
            border-radius: 5px;
            margin: 20px 0;
            overflow: hidden;
        }

        // 初始化测验
        function initQuiz() {
            const quizContainer = document.getElementById('quizContainer');
            quizContainer.innerHTML = '';
            
            questions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                
                questionDiv.innerHTML = `
                    <div class="question-number">第 ${q.number} 题</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options" id="options-${index}">
                        ${q.options.map((option, optIndex) => 
                            `<label>
                                <input type="radio" name="q${index}" value="${optIndex}" class="option-input">
                                ${String.fromCharCode(65 + optIndex)}. ${option}
                            </label>`
                        ).join('')}
                    </div>
                    <div class="explanation" id="explanation-${index}">${q.explanation}</div>
                `;
                
                quizContainer.appendChild(questionDiv);
            });
            
            // 添加事件监听器
            document.querySelectorAll('.option-input').forEach(input => {
                input.addEventListener('change', function() {
                    const questionIndex = parseInt(this.name.replace('q', ''));
                    const explanationDiv = document.getElementById(`explanation-${questionIndex}`);
                    explanationDiv.classList.remove('show');
                });
            });
        }

        // 提交测验
        function submitQuiz() {
            const selectedAnswers = [];
            let correctCount = 0;
            
            questions.forEach((q, index) => {
                const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);
                if (selectedOption) {
                    const selectedValue = parseInt(selectedOption.value);
                    selectedAnswers.push(selectedValue);
                    
                    // 检查答案是否正确
                    const optionDiv = document.getElementById(`options-${index}`);
                    const explanationDiv = document.getElementById(`explanation-${index}`);
                    
                    // 清除之前的样式
                    optionDiv.querySelectorAll('label').forEach(label => {
                        label.style.fontWeight = 'normal';
                        label.style.color = '#333';
                    });
                    
                    // 标记正确和错误答案
                    const labels = optionDiv.querySelectorAll('label');
                    labels.forEach((label, i) => {
                        if (i === q.answer) {
                            label.style.fontWeight = 'bold';
                            label.style.color = '#27ae60';
                        } else if (i === selectedValue && i !== q.answer) {
                            label.style.fontWeight = 'bold';
                            label.style.color = '#e74c3c';
                        }
                    });
                    
                    // 显示解析
                    explanationDiv.classList.add('show');
                    
                    if (selectedValue === q.answer) {
                        correctCount++;
                    }
                }
            });
            
            // 显示结果
            const resultsDiv = document.getElementById('results');
            const scoreDiv = document.getElementById('score');
            const feedbackDiv = document.getElementById('feedback');
            
            const percentage = Math.round((correctCount / questions.length) * 100);
            scoreDiv.textContent = `得分：${correctCount}/${questions.length} (${percentage}%)`;
            
            // 根据分数给出反馈
            if (percentage >= 90) {
                feedbackDiv.textContent = "优秀！您对数据库知识掌握得非常扎实。";
                feedbackDiv.style.color = "#27ae60";
            } else if (percentage >= 80) {
                feedbackDiv.textContent = "良好！您对数据库知识有很好的理解。";
                feedbackDiv.style.color = "#2980b9";
            } else if (percentage >= 70) {
                feedbackDiv.textContent = "合格！您对数据库知识有一定了解，但还有提升空间。";
                feedbackDiv.style.color = "#f39c12";
            } else {
                feedbackDiv.textContent = "需要加强！建议复习数据库核心概念，特别是锁和B+树相关内容。";
                feedbackDiv.style.color = "#e74c3c";
            }
            
            resultsDiv.style.display = 'block';
            
            // 更新进度条
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = '100%';
            
            // 禁用提交按钮
            document.getElementById('submitBtn').disabled = true;
        }

        // 重置测验
        function resetQuiz() {
            document.getElementById('results').style.display = 'none';
            document.getElementById('submitBtn').disabled = false;
            
            // 清除所有选择
            document.querySelectorAll('.option-input').forEach(input => {
                input.checked = false;
            });
            
            // 隐藏所有解析
            document.querySelectorAll('.explanation').forEach(explanation => {
                explanation.classList.remove('show');
            });
            
            // 清除样式
            document.querySelectorAll('label').forEach(label => {
                label.style.fontWeight = 'normal';
                label.style.color = '#333';
            });
            
            // 重置进度条
            document.getElementById('progressBar').style.width = '0%';
        }

        // 页面加载完成后初始化测验
        document.addEventListener('DOMContentLoaded', function() {
            initQuiz();
            
            // 添加进度条动画
            const progressBar = document.getElementById('progressBar');
            let progress = 0;
            const interval = setInterval(() => {
                if (progress < 100) {
                    progress += 0.5;
                    progressBar.style.width = progress + '%';
                } else {
                    clearInterval(interval);
                }
            }, 50);
        });
    </script>
